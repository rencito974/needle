name: Boost

on:
  workflow_dispatch:
    inputs:
      spotify_ipa_url:
        description: "Direct download URL to the decrypted Spotify IPA (leave blank to pull from the spotify-cache release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build_and_inject:
    runs-on: ubuntu-22.04
    env:
      THEOS: /home/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git perl build-essential fakeroot dpkg xz-utils lzma libtinfo5 libncurses5 python3-pip

      - name: Set up Theos + iOS cross toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip 1

          TC_URL="https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          curl -fL -o /tmp/toolchain.tar.lzma "$TC_URL"
          mkdir -p /tmp/tc
          tar --lzma -xf /tmp/toolchain.tar.lzma -C /tmp/tc

          mkdir -p $THEOS/toolchain/linux/iphone
          TOP_DIRS=$(find /tmp/tc -maxdepth 1 -mindepth 1 -type d)
          TOP_COUNT=$(echo "$TOP_DIRS" | grep -c . || true)
          if [ "$TOP_COUNT" = "1" ]; then SRC="$TOP_DIRS"; else SRC="/tmp/tc"; fi
          cp -a "$SRC"/* $THEOS/toolchain/linux/iphone/

          if [ ! -f $THEOS/toolchain/linux/iphone/bin/clang ]; then
            REAL=$(find $THEOS/toolchain/linux/iphone/bin -maxdepth 1 -name "*clang*" -type f ! -name "*++*" ! -name "*format*" ! -name "*tidy*" | head -1)
            if [ -n "$REAL" ]; then
              ln -sf "$(basename $REAL)" $THEOS/toolchain/linux/iphone/bin/clang
              REAL_PP=$(find $THEOS/toolchain/linux/iphone/bin -maxdepth 1 -name "*clang++" -type f | head -1)
              [ -n "$REAL_PP" ] && ln -sf "$(basename $REAL_PP)" $THEOS/toolchain/linux/iphone/bin/clang++
            fi
          fi

      - name: Build Needle with NEEDLE_BOOST=1
        working-directory: Tweak
        run: make package FINALPACKAGE=1 NEEDLE_BOOST=1

      - name: Rename deb
        working-directory: Tweak/packages
        run: |
          deb=$(ls *.deb | head -1)
          cp "$deb" Needle-boost.deb

      - name: Install cyan and deps
        run: |
          pip3 install --upgrade git+https://github.com/asdfzxcvbn/pyzule-rw
          pip3 install Pillow numpy

      - name: Fetch Spotify IPA
        env:
          GH_TOKEN: ${{ github.token }}
          SPOTIFY_URL: ${{ inputs.spotify_ipa_url }}
        run: |
          mkdir -p work
          if [ -n "$SPOTIFY_URL" ]; then
            curl -L -o work/spotify.ipa "$SPOTIFY_URL"
          else
            gh release download spotify-cache -R ${{ github.repository }} -p "*.ipa" -D work --clobber
            src=$(ls work/*.ipa | grep -v Needle-Spotify | head -1)
            mv "$src" work/spotify.ipa
          fi
          file work/spotify.ipa

      - name: Run cyan
        run: |
          cp Tweak/packages/Needle-boost.deb work/
          cd work
          NEEDLE_VER=$(date -u +%Y.%m.%d.%H%M)
          cyan -i spotify.ipa -o Needle-Spotify-boost.ipa -f Needle-boost.deb -u \
            -b com.needle.spotify \
            -n "Spotify" \
            -v "$NEEDLE_VER"
          ls -la Needle-Spotify-boost.ipa

      - name: Patch alternate icons into IPA
        run: |
          python3 .github/scripts/patch_icons.py work/Needle-Spotify-boost.ipa
          ls -la work/Needle-Spotify-boost.ipa

      - name: Publish Needle-Spotify-boost.ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest -R ${{ github.repository }} work/Needle-Spotify-boost.ipa --clobber
          gh release view latest -R ${{ github.repository }} --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
