name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y curl git perl build-essential fakeroot dpkg xz-utils lzma

      - name: Set up Theos + iOS cross toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip 1

          TC_URL="https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          echo "=== downloading toolchain ==="
          curl -fL -o /tmp/toolchain.tar.lzma "$TC_URL"
          ls -la /tmp/toolchain.tar.lzma

          mkdir -p /tmp/tc
          tar --lzma -xf /tmp/toolchain.tar.lzma -C /tmp/tc
          echo "=== extracted layout ==="
          find /tmp/tc -maxdepth 4 -name clang -type f | head

          mkdir -p $THEOS/toolchain/linux
          TC_BIN=$(find /tmp/tc -maxdepth 4 -name clang -type f | head -1)
          TC_ROOT=$(dirname $(dirname "$TC_BIN"))
          echo "TC_ROOT=$TC_ROOT"
          mv "$TC_ROOT" $THEOS/toolchain/linux/iphone

          echo "=== verify ==="
          ls $THEOS/toolchain/linux/iphone/bin/clang
          $THEOS/toolchain/linux/iphone/bin/clang --version || true

      - name: Build
        working-directory: Tweak
        run: make package FINALPACKAGE=1

      - name: Rename artifact
        working-directory: Tweak/packages
        run: |
          deb=$(ls *.deb | head -1)
          cp "$deb" Needle-latest.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Needle
          path: Tweak/packages/*.deb

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Install the .deb through Sileo on a jailbroken device, or extract the dylib and inject with cyan into a decrypted Spotify IPA for sideload."
          gh release upload latest Tweak/packages/Needle-latest.deb --clobber
