name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git perl build-essential fakeroot dpkg xz-utils lzma
          sudo apt-get install -y libncurses5 libtinfo5 2>/dev/null || true
          if [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ] && [ -f /lib/x86_64-linux-gnu/libtinfo.so.6 ]; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          if [ ! -f /lib/x86_64-linux-gnu/libncurses.so.5 ] && [ -f /lib/x86_64-linux-gnu/libncurses.so.6 ]; then
            sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5
          fi
          ldconfig -p | grep -E "libtinfo|libncurses" | head

      - name: Set up Theos + iOS cross toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip 1

          TC_URL="https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          echo "=== downloading toolchain ==="
          curl -fL -o /tmp/toolchain.tar.lzma "$TC_URL"
          ls -la /tmp/toolchain.tar.lzma

          mkdir -p /tmp/tc
          tar --lzma -xf /tmp/toolchain.tar.lzma -C /tmp/tc
          echo "=== /tmp/tc top level ==="
          ls -la /tmp/tc
          echo "=== first-level dirs ==="
          find /tmp/tc -maxdepth 2 -type d
          echo "=== any clang* file ==="
          find /tmp/tc -type f -name "clang*" 2>/dev/null | head -10
          echo "=== any bin dir ==="
          find /tmp/tc -type d -name bin 2>/dev/null | head

          mkdir -p $THEOS/toolchain/linux/iphone
          TOP_DIRS=$(find /tmp/tc -maxdepth 1 -mindepth 1 -type d)
          TOP_COUNT=$(echo "$TOP_DIRS" | grep -c . || true)
          if [ "$TOP_COUNT" = "1" ]; then
            SRC="$TOP_DIRS"
          else
            SRC="/tmp/tc"
          fi
          echo "Using SRC=$SRC"
          cp -a "$SRC"/* $THEOS/toolchain/linux/iphone/

          echo "=== iphone/ root ==="
          ls -la $THEOS/toolchain/linux/iphone/ | head
          echo "=== iphone/bin ==="
          ls $THEOS/toolchain/linux/iphone/bin/ 2>/dev/null | head -20

          if [ ! -f $THEOS/toolchain/linux/iphone/bin/clang ]; then
            REAL=$(find $THEOS/toolchain/linux/iphone/bin -maxdepth 1 -name "*clang*" -type f ! -name "*++*" ! -name "*format*" ! -name "*tidy*" | head -1)
            if [ -n "$REAL" ]; then
              ln -sf "$(basename $REAL)" $THEOS/toolchain/linux/iphone/bin/clang
              REAL_PP=$(find $THEOS/toolchain/linux/iphone/bin -maxdepth 1 -name "*clang++" -type f | head -1)
              [ -n "$REAL_PP" ] && ln -sf "$(basename $REAL_PP)" $THEOS/toolchain/linux/iphone/bin/clang++
            fi
          fi

          echo "=== final verify ==="
          ls -la $THEOS/toolchain/linux/iphone/bin/clang
          $THEOS/toolchain/linux/iphone/bin/clang --version || true

      - name: Build
        working-directory: Tweak
        run: make package FINALPACKAGE=1

      - name: Rename artifact
        working-directory: Tweak/packages
        run: |
          deb=$(ls *.deb | head -1)
          cp "$deb" Needle-latest.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Needle
          path: Tweak/packages/*.deb

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Install the .deb through Sileo on a jailbroken device, or extract the dylib and inject with cyan into a decrypted Spotify IPA for sideload."
          gh release upload latest Tweak/packages/Needle-latest.deb --clobber
